name: AgentShip publish check

on:
  workflow_run:
    workflows:
      - AgentShip report
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: read

concurrency:
  group: agentship-publish-check-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish neutral evidence check
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
          persist-credentials: false

      - name: Download untrusted evidence artifact as data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agentship-evidence-${{ github.event.workflow_run.pull_requests[0].number }}
          path: ${{ runner.temp }}/agentship-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bounded Check Run payload
        env:
          AGENTSHIP_ARTIFACT_ROOT: ${{ runner.temp }}/agentship-evidence
          AGENTSHIP_REPORT: ${{ runner.temp }}/agentship-evidence/ci.json
          AGENTSHIP_CHECK_PAYLOAD: ${{ runner.temp }}/agentship-check-run.json
        run: >-
          node publisher/scripts/build-check-run.mjs
          "$GITHUB_EVENT_PATH"
          "$AGENTSHIP_REPORT"
          "$AGENTSHIP_CHECK_PAYLOAD"

      - name: Publish neutral Check Run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENTSHIP_CHECK_PAYLOAD: ${{ runner.temp }}/agentship-check-run.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.env.AGENTSHIP_CHECK_PAYLOAD, "utf8"));
            await github.rest.checks.create(payload);
