name: AgentShip publish check

on:
  workflow_run:
    workflows:
      - AgentShip report
    types:
      - completed

permissions:
  actions: read
  attestations: write
  checks: write
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    uses: hasak21/agentship/.github/workflows/agentship-publish-check-reusable.yml@7e68cb44d67d66ac8cb00a4b84ae3e3a5994e41b
    with:
      verifier_repository: hasak21/agentship
      verifier_ref: 7e68cb44d67d66ac8cb00a4b84ae3e3a5994e41b
