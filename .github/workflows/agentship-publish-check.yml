name: AgentShip publish check

on:
  workflow_run:
    workflows:
      - AgentShip report
    types:
      - completed

permissions:
  actions: read
  attestations: write
  checks: write
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    uses: hasak21/agentship/.github/workflows/agentship-publish-check-reusable.yml@cc4d26eab4519ae0527b32ec23bb1da4b33ff161
    with:
      verifier_repository: hasak21/agentship
      verifier_ref: cc4d26eab4519ae0527b32ec23bb1da4b33ff161
