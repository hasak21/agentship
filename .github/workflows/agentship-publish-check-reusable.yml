name: AgentShip reusable publisher

on:
  workflow_call:
    inputs:
      verifier_repository:
        description: GitHub repository containing the trusted AgentShip publisher
        required: true
        type: string
      verifier_ref:
        description: Full immutable commit SHA of the trusted AgentShip publisher
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  checks: write
  contents: read
  id-token: write

concurrency:
  group: agentship-publish-check-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish neutral evidence check
    runs-on: ubuntu-24.04
    cache-mode: write-only
    timeout-minutes: 5
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.verifier_repository }}
          ref: ${{ inputs.verifier_ref }}
          path: publisher
          persist-credentials: false

      - name: Download untrusted evidence artifact as data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agentship-evidence-${{ github.event.workflow_run.pull_requests[0].number }}
          path: ${{ runner.temp }}/agentship-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build bounded Check Run payload
        env:
          AGENTSHIP_ARTIFACT_ROOT: ${{ runner.temp }}/agentship-evidence
          AGENTSHIP_REPORT: ${{ runner.temp }}/agentship-evidence/ci.json
          AGENTSHIP_CHECK_PAYLOAD: ${{ runner.temp }}/agentship-check-run.json
          AGENTSHIP_HISTORY_ROOT: ${{ runner.temp }}/agentship-history
          AGENTSHIP_HISTORY_REPORT: ${{ runner.temp }}/agentship-history/${{ github.event.workflow_run.id }}.json
        run: >-
          node publisher/scripts/build-check-run.mjs
          "$GITHUB_EVENT_PATH"
          "$AGENTSHIP_REPORT"
          "$AGENTSHIP_CHECK_PAYLOAD"
          "$AGENTSHIP_HISTORY_REPORT"

      - name: Attest validated canonical report
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/agentship-history/${{ github.event.workflow_run.id }}.json

      - name: Upload attested canonical evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentship-attested-evidence-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/agentship-history/${{ github.event.workflow_run.id }}.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Save validated review history
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agentship-history
          key: agentship-history-v1-pr-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.id }}

      - name: Publish neutral Check Run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENTSHIP_CHECK_PAYLOAD: ${{ runner.temp }}/agentship-check-run.json
          AGENTSHIP_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.env.AGENTSHIP_CHECK_PAYLOAD, "utf8"));
            const attestation = new URL(process.env.AGENTSHIP_ATTESTATION_URL);
            if (attestation.protocol !== "https:" || attestation.hostname !== "github.com" || attestation.username || attestation.password) {
              throw new Error("Attestation URL must be a credential-free github.com HTTPS URL.");
            }
            payload.output.summary += `\n- Publisher attestation: ${attestation.href}`;
            await github.rest.checks.create(payload);
