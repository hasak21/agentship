version: 1
mode: report

limits:
  maxChangedFiles: 500
  maxDiffBytes: 5242880

checks:
  - name: lint
    run: npm run lint
    required: true
    timeoutSeconds: 120

  - name: test
    run: npm test
    required: true
    timeoutSeconds: 120

  - name: build
    run: npm run build
    required: true
    timeoutSeconds: 180
    whenChanged:
      - src/**
      - package.json
      - package-lock.json
      - next.config.mjs
      - tsconfig.json
    network: allowed
    environment:
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY

  - name: cli-package
    run: npm run verify:cli
    required: true
    timeoutSeconds: 120
    whenChanged:
      - src/cli/**
      - src/review/**
      - scripts/verify-cli.mjs
      - package.json
      - package-lock.json

policy:
  blockOn:
    - required_check_failed
    - required_check_timed_out
    - explicit_requirement_path_unchanged
    - explicit_requirement_evidence_unsatisfied
  protectedPaths:
    - pattern: src/app/api/**
      requireManualApproval: true
    - pattern: src/review/**
      requireManualApproval: true
